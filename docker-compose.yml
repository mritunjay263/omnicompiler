version: '3.8'

services:
  omnicompiler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnicompiler-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - SESSION_SECRET=omnicompiler_prod_jwt_secret_key_89472190
    volumes:
      - omnicompiler_data:/app/.data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          memory: 256M

volumes:
  omnicompiler_data:
    name: omnicompiler_storage_data
